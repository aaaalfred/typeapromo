name: typeapromo

# La misma imagen sirve para migrar y para servir. La construye `app` y sólo
# `app`: si ambos servicios declararan `build`, buildx exportaría la misma
# etiqueta dos veces en paralelo y la construcción fallaría con «already exists».
x-app-image: &app-image typeapromo-app:local

services:
  # Aplica las migraciones pendientes y termina. `app` no arranca hasta que
  # este servicio sale con código 0, así que la aplicación nunca ve un esquema
  # desactualizado. Es idempotente: en un `up` sin migraciones nuevas no hace nada.
  migrate:
    image: *app-image
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://typeapromo:typeapromo@postgres:5432/typeapromo
    command: ['node', 'scripts/migrate.mjs']
    restart: 'no'

  app:
    image: *app-image
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://typeapromo:typeapromo@postgres:5432/typeapromo
      PUBLIC_BASE_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET:-desarrollo-local-no-usar-en-produccion}
      # AUTH_DEV_BYPASS se omite a propósito: no debe existir fuera de desarrollo y CI
      # (PLAN.md, «Seguridad del bypass», protección 1).
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      R2_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      R2_BUCKET_STAGING: forms-media-staging
      R2_BUCKET_PUBLIC: forms-media-public
      MEDIA_PUBLIC_BASE_URL: http://localhost:9000/forms-media-public
      S3_FORCE_PATH_STYLE: '1'
      CLEANUP_SECRET: ${CLEANUP_SECRET:-desarrollo-local-no-usar-en-produccion}
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: typeapromo
      POSTGRES_PASSWORD: typeapromo
      POSTGRES_DB: typeapromo
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U typeapromo -d typeapromo']
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10
    restart: unless-stopped

  # Crea los dos buckets del pipeline de media y expone el público en solo lectura.
  # Se ejecuta una vez y termina; no es un servicio permanente.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/forms-media-staging &&
      mc mb --ignore-existing local/forms-media-public &&
      mc anonymous set download local/forms-media-public
      "
    restart: 'no'

volumes:
  postgres-data:
  minio-data:
